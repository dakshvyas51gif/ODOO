<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Brightloop</title>

    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/forgot-password.js" defer></script>
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-logo">B</div>
                <h1>Brightloop</h1>
            </div>

            <div class="auth-heading">
                <h2>Forgot Password?</h2>
                <p>
                    Enter your registered email address.
                    We'll send you a password reset link.
                </p>
            </div>

            <form id="forgotPasswordForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                    <small class="field-error" id="emailError"></small>
                </div>

                <div
                    class="form-message"
                    id="formMessage"
                    role="alert"
                    aria-live="polite">
                </div>

                <button type="submit" id="forgotPasswordButton">
                    Send Reset Link
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Remember your password?
                    <a href="login.html">Back to Login</a>
                </p>
            </div>

            <p class="terms-text">
                Brightloop Account Security
            </p>

        </section>

    </main>

</body>
</html>
