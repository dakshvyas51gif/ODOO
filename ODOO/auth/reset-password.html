
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Brightloop</title>

    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/reset-password.js" defer></script>
</head>

<body>

    <main class="auth-container">
        <section class="auth-card">

            <div class="brand">
                <div class="brand-logo">B</div>
                <h1>Brightloop</h1>
            </div>

            <div class="auth-heading">
                <h2>Reset Password</h2>
                <p>Create a new password for your account.</p>
            </div>

            <form id="resetPasswordForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        name="new_password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <small class="password-hint">
                        More than 8 characters, uppercase,
                        lowercase and a special character.
                    </small>

                    <small class="field-error" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <small class="field-error" id="confirmPasswordError"></small>
                </div>

                <div
                    class="form-message"
                    id="formMessage"
                    role="alert"
                    aria-live="polite">
                </div>

                <button type="submit" id="resetPasswordButton">
                    Reset Password
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Remember your password?
                    <a href="login.html">Back to Login</a>
                </p>
            </div>

            <p class="terms-text">
                Brightloop Account Security
            </p>

        </section>
    </main>

</body>
</html>
