<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Brightloop customer account.">

    <title>Create Account | Brightloop</title>

    <link rel="stylesheet" href="../css/auth.css">

    <script src="../js/signup.js" defer></script>
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-logo">B</div>
                <h1>Brightloop</h1>
            </div>

            <div class="auth-heading">
                <h2>Create your account</h2>
                <p>Get started with Brightloop today.</p>
            </div>

            <form id="signupForm" novalidate>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                    <small class="field-error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <small class="field-error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        minlength="9"
                        required
                    >
                    <small class="password-hint">
                        More than 8 characters, including uppercase,
                        lowercase and a special character.
                    </small>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                    <small class="field-error" id="confirmPasswordError"></small>
                </div>

                <div class="form-message"
                     id="formMessage"
                     role="alert"
                     aria-live="polite">
                </div>

                <button type="submit" id="signupButton">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>

            <p class="terms-text">
                By creating an account, you agree to our
                <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>.
            </p>

        </section>

    </main>

</body>
</html>
